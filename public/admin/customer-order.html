<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Order Customer | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
      const C = {
        inp: "w-full border border-sky-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 bg-white",
        btn: "bg-sky-500 hover:bg-sky-600 text-white text-sm font-semibold rounded-xl px-4 py-2 transition disabled:opacity-50",
        ghost:
          "border border-sky-200 text-sky-700 hover:bg-sky-50 text-xs rounded-lg px-3 py-1.5 disabled:opacity-40",
        card: "bg-white rounded-2xl border border-sky-100 shadow-sm",
        err: "hidden mb-3 bg-rose-50 text-rose-600 text-sm rounded-xl px-3 py-2",
      };
      function toast(m, ok = true) {
        const t = document.createElement("div");
        t.className = `fixed top-4 right-4 z-[70] max-w-xs px-4 py-3 rounded-xl text-sm text-white shadow-lg ${ok ? "bg-emerald-500" : "bg-rose-500"}`;
        t.textContent = m;
        document.body.append(t);
        setTimeout(() => t.remove(), 3500);
      }
      function modal(html, wide) {
        const o = document.createElement("div");
        o.className =
          "fixed inset-0 z-50 bg-slate-900/40 flex items-end sm:items-center justify-center sm:p-4";
        o.innerHTML = `<div class="bg-white w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5">${html}</div>`;
        document.body.append(o);
        o.addEventListener("mousedown", (e) => {
          if (e.target === o) o.remove();
        });
        return o;
      }
      const showErr = (m, msg) => {
        const e = $("[data-er]", m);
        e.textContent = msg;
        e.classList.remove("hidden");
      }
      function compress(file, max = 1600) {
        return new Promise((ok, no) => {
          const img = new Image();
          img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height)),
              c = document.createElement("canvas");
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            let q = 0.9,
              d;
            do {
              d = c.toDataURL("image/jpeg", q);
              q -= 0.1;
            } while (d.length > 2.6e6 && q > 0.2);
            d.length > 2.9e6 ? no(new Error("Gambar terlalu besar")) : ok(d);
          };
          img.onerror = () => no(new Error("File bukan gambar valid"));
          img.src = URL.createObjectURL(file);
        });
      }
      async function uploadImage(file) {
        if (!/^image\/(png|jpe?g|webp)$/.test(file.type))
          throw new Error("Hanya PNG/JPG/WEBP");
        const data = await compress(file);
        const r = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data, name: file.name }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || "Upload gagal");
        return j.url;
      }
      async function api(url, method = "GET", body) {
        const r = await fetch(url, {
          method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (r.status === 401) {
          location.href = "/signin";
          throw new Error("Sesi berakhir");
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          const e = new Error(j.error || "Terjadi kesalahan");
          e.status = r.status;
          throw e;
        }
        return j;
      }
      async function logout() {
        await fetch("/api/auth/logout", { method: "POST" });
        location.href = "/signin";
      }
      const NAV = [
        ["dashboard", "fa-chart-line", "Dashboard"],
        ["product-management", "fa-box", "Produk"],
        ["customer-order", "fa-receipt", "Order"],
        ["payment-method", "fa-credit-card", "Rekening"],
        ["testimonial", "fa-comments", "Testimoni"],
      ];
      function shell(active) {
        const side = NAV.map(
          ([n, i, t]) =>
            `<a href="/${n}" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm ${n === active ? "bg-sky-100 text-sky-800 font-bold" : "hover:bg-sky-50"}"><i class="fa-solid ${i} w-4"></i>${t}</a>`,
        ).join("");
        const bot = NAV.map(
          ([n, i, t]) =>
            `<a href="/${n}" class="flex-1 py-2 text-center text-[10px] ${n === active ? "text-sky-600 font-bold" : "text-slate-400"}"><i class="fa-solid ${i} block text-base mb-0.5"></i>${t}</a>`,
        ).join("");
        document.body.classList.add(
          "bg-sky-50",
          "text-slate-700",
          "min-h-screen",
          "md:ml-56",
          "pb-20",
          "md:pb-0",
        );
        document.body.insertAdjacentHTML(
          "afterbegin",
          `<aside class="hidden md:flex fixed inset-y-0 left-0 w-56 bg-white border-r border-sky-100 flex-col p-4 gap-1"><b class="text-sky-900 text-lg mb-4">Skills Admin</b>${side}<button onclick="logout()" class="mt-auto text-left px-3 py-2 text-sm text-rose-500"><i class="fa-solid fa-right-from-bracket mr-2"></i>Logout</button></aside>
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-sky-100 flex">${bot}<button onclick="logout()" class="flex-1 py-2 text-center text-[10px] text-rose-500"><i class="fa-solid fa-right-from-bracket block text-base mb-0.5"></i>Keluar</button></nav>`,
        );
      }
      const confirmBox = (msg) =>
        new Promise((res) => {
          const m = modal(
            `<p class="mb-4 text-sm">${esc(msg)}</p><div class="flex gap-2 justify-end"><button data-n class="${C.ghost}">Batal</button><button data-y class="${C.btn}">Ya, lanjut</button></div>`,
          );
          $("[data-n]", m).onclick = () => {
            m.remove();
            res(false);
          };
          $("[data-y]", m).onclick = () => {
            m.remove();
            res(true);
          };
        });
      function pager(el, d, go) {
        el.innerHTML = `<div class="flex items-center justify-between mt-4 text-sm"><button data-p class="${C.ghost}" ${d.page <= 1 ? "disabled" : ""}>&laquo; Previous</button><span class="text-slate-500">Hal ${d.page} / ${d.pages} | ${d.total} data</span><button data-n class="${C.ghost}" ${d.page >= d.pages ? "disabled" : ""}>Next &raquo;</button></div>`;
        $("[data-p]", el).onclick = () => go(d.page - 1);
        $("[data-n]", el).onclick = () => go(d.page + 1);
      }
      function simpleForm(title, fields, d, save) {
        d = d || {};
        const m = modal(
          `<h2 class="font-bold text-sky-900 mb-3">${esc(title)}</h2><div data-er class="${C.err}"></div>${fields.map(([k, l, t]) => `<label class="block text-sm mb-3">${esc(l)}${t === "textarea" ? `<textarea name="${k}" rows="4" maxlength="500" class="${C.inp} mt-1">${esc(d[k])}</textarea>` : `<input name="${k}" maxlength="80" value="${esc(d[k])}" class="${C.inp} mt-1">`}</label>`).join("")}<div class="flex gap-2 justify-end"><button data-x class="${C.ghost}">Batal</button><button data-s class="${C.btn}">Simpan</button></div>`,
        );
        $("[data-x]", m).onclick = () => m.remove();
        $("[data-s]", m).onclick = async (e) => {
          const b = e.target;
          b.disabled = true;
          const body = {};
          fields.forEach(([k]) => (body[k] = $(`[name=${k}]`, m).value));
          try {
            await save(body);
            m.remove();
          } catch (x) {
            showErr(m, x.message);
            b.disabled = false;
          }
        };
      }
    </script>
  </head>
  <body>
    <main class="max-w-6xl mx-auto p-4">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-extrabold text-sky-900">Order Customer</h1>
        <select
          id="st"
          class="border border-sky-200 rounded-xl px-3 py-2 text-sm bg-white"
        >
          <option value="">Semua status</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="bg-white rounded-2xl border border-sky-100 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-sky-50 text-left text-sky-800">
            <tr class="[&>th]:p-3">
              <th>ID</th>
              <th>Produk</th>
              <th>Harga</th>
              <th>Pembeli</th>
              <th>Status</th>
              <th>Tanggal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="pg"></div>
    </main>
    <script>
      shell("customer-order");
      let page = 1;
      const B = {
        pending: "bg-amber-100 text-amber-700",
        accepted: "bg-emerald-100 text-emerald-700",
        rejected: "bg-rose-100 text-rose-600",
      };
      async function load(p = page) {
        try {
          const d = await api(
            `/api/admin/orders?page=${p}&limit=10` +
              ($("#st").value ? "&status=" + $("#st").value : ""),
          );
          if (!d.items.length && p > 1) return load(p - 1);
          page = d.page;
          $("#rows").innerHTML =
            d.items
              .map(
                (
                  o,
                ) => `<tr class="border-t border-sky-50 [&>td]:p-3"><td>#${o.id}</td><td>${esc(o.product_name)}</td><td class="whitespace-nowrap">${rp(o.price_paid)}</td><td>${esc(o.buyer_name)}</td>
    <td><span class="px-2 py-0.5 rounded-md text-xs ${B[o.status] || ""}">${esc(o.status)}</span>${o.checksum_ok ? "" : ' <span class="px-2 py-0.5 rounded-md text-xs bg-rose-600 text-white"><i class="fa-solid fa-triangle-exclamation"></i> Checksum tidak cocok</span>'}</td>
    <td class="whitespace-nowrap">${esc(new Date(o.created_at).toLocaleString("id-ID", { timeZone: "Asia/Makassar" }) + " WITA")}</td>
    <td class="whitespace-nowrap space-x-1">${o.status !== "accepted" ? `<button data-a="accepted" data-id="${o.id}" class="${C.ghost} !text-emerald-600">Accept</button>` : ""}${o.status !== "rejected" ? `<button data-a="rejected" data-id="${o.id}" class="${C.ghost} !text-rose-500">Reject</button>` : ""}<button data-v="${o.id}" class="${C.ghost}">Detail</button><a href="${esc(o.wa_url)}" target="_blank" rel="noopener" class="${C.ghost} inline-block !text-emerald-600"><i class="fa-brands fa-whatsapp"></i></a></td></tr>`,
              )
              .join("") ||
            '<tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada order</td></tr>';
          pager($("#pg"), d, load);
        } catch (e) {
          toast(e.message, false);
        }
      }
      $("#st").onchange = () => load(1);
      
      $("#rows").onclick = async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        
        if (b.dataset.a) {
          const isReject = b.dataset.a === "rejected";
          if (
            !(await confirmBox(
              `${isReject ? "Tolak dan HAPUS PERMANEN" : "Terima"} order #${b.dataset.id}?`
            ))
          )
            return;
            
          try {
            if (isReject) {
              await api(`/api/admin/orders/${b.dataset.id}`, "DELETE");
              toast("Order berhasil dihapus permanen");
            } else {
              await api(`/api/admin/orders/${b.dataset.id}/status`, "PATCH", {
                status: b.dataset.a,
              });
              toast("Status order diperbarui");
            }
            load();
          } catch (x) {
            toast(x.message, false);
          }
        } else if (b.dataset.v) {
          try {
            const o = await api("/api/admin/orders/" + b.dataset.v);
            const m = modal(
              `<h2 class="font-bold text-sky-900 mb-3">Order #${o.id}</h2><dl class="text-sm space-y-1 mb-3">${[
                ["Produk", o.product_name],
                ["Harga", rp(o.price_paid)],
                ["Pembeli", o.buyer_name],
                ["WhatsApp", o.whatsapp],
                ["Bank", o.bank_name || "-"],
              ]
                .map(
                  ([k, v]) =>
                    `<div class="flex justify-between gap-3"><dt class="text-slate-500">${k}</dt><dd class="font-semibold text-right">${esc(v)}</dd></div>`,
                )
                .join(
                  "",
                )}</dl><p class="text-xs text-slate-500 mb-1">Bukti pembayaran (klik untuk memperbesar)</p><img src="${esc(o.proof_url)}" class="w-full max-h-72 object-contain rounded-xl bg-sky-50 cursor-zoom-in"><button data-x class="${C.btn} w-full mt-4">Tutup</button>`,
            );
            $("[data-x]", m).onclick = () => m.remove();
            $("img", m).onclick = () => {
              const z = modal(
                `<img src="${esc(o.proof_url)}" class="w-full"><button data-x class="${C.btn} w-full mt-3">Tutup</button>`,
                true,
              );
              $("[data-x]", z).onclick = () => z.remove();
            };
          } catch (x) {
            toast(x.message, false);
          }
        }
      };
      load();
    </script>
  </body>
</html>
