<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Order Customer | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }</style>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[c]);
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
      
      const C = {
        inp: "w-full border border-emerald-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 bg-slate-50 transition-all font-medium text-slate-800",
        btn: "bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl px-5 py-2.5 transition disabled:opacity-50",
        ghost: "border border-emerald-200 bg-white text-emerald-700 hover:bg-emerald-50 text-xs font-bold rounded-lg px-3 py-1.5 disabled:opacity-40 transition",
        card: "bg-white rounded-3xl border border-emerald-100 shadow-sm",
        err: "hidden mb-4 bg-rose-50 text-rose-700 text-sm font-bold rounded-xl px-4 py-3 border border-rose-100",
      };

      function toast(m, ok = true) {
        const t = document.createElement("div");
        t.className = `fixed top-6 right-6 z-[70] max-w-xs px-5 py-3.5 rounded-2xl text-sm font-bold text-white shadow-xl transition-all ${ok ? "bg-teal-600" : "bg-rose-600"}`;
        t.textContent = m;
        document.body.append(t);
        setTimeout(() => t.remove(), 3500);
      }

      function modal(html, wide) {
        const o = document.createElement("div");
        o.className = "fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4";
        o.innerHTML = `<div class="bg-white w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">${html}</div>`;
        document.body.append(o);
        o.addEventListener("mousedown", (e) => { if (e.target === o) o.remove(); });
        return o;
      }

      async function api(url, method = "GET", body) {
        const r = await fetch(url, {
          method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (r.status === 401) { location.href = "/signin"; throw new Error("Sesi berakhir"); }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(j.error || "Terjadi kesalahan"); e.status = r.status; throw e; }
        return j;
      }

      async function logout() {
        await fetch("/api/auth/logout", { method: "POST" });
        location.href = "/signin";
      }

      const NAV = [
        ["dashboard", "fa-chart-pie", "Dashboard"],
        ["product-management", "fa-boxes-stacked", "Katalog Produk"],
        ["customer-order", "fa-receipt", "Pesanan"],
        ["payment-method", "fa-building-columns", "Rekening Bank"],
        ["testimonial", "fa-comments", "Testimoni"],
      ];

      function shell(active) {
        const side = NAV.map(
          ([n, i, t]) =>
            `<a href="/${n}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${n === active ? "bg-emerald-100/60 text-emerald-800" : "text-slate-600 hover:bg-slate-50 hover:text-emerald-700"}"><i class="fa-solid ${i} w-5 text-center"></i>${t}</a>`,
        ).join("");
        const bot = NAV.map(
          ([n, i, t]) =>
            `<a href="/${n}" class="flex-1 py-3 text-center text-[10px] font-bold transition-all ${n === active ? "text-emerald-700 bg-emerald-50/50" : "text-slate-400"}"><i class="fa-solid ${i} block text-lg mb-1"></i>${t}</a>`,
        ).join("");
        document.body.classList.add("bg-slate-50", "text-slate-800", "min-h-screen", "md:ml-64", "pb-20", "md:pb-0");
        document.body.insertAdjacentHTML(
          "afterbegin",
          `<aside class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-white border-r border-emerald-100 flex-col p-5 gap-2 shadow-sm">
            <div class="flex items-center gap-3 mb-6 px-2">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-leaf"></i></div>
              <b class="text-emerald-950 text-xl tracking-tight">Admin Area</b>
            </div>
            ${side}
            <button onclick="logout()" class="mt-auto text-left px-4 py-3 text-sm font-bold text-rose-600 hover:bg-rose-50 rounded-2xl transition"><i class="fa-solid fa-power-off mr-2"></i>Keluar Sistem</button>
          </aside>
          <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-emerald-100 flex shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            ${bot}
            <button onclick="logout()" class="flex-1 py-3 text-center text-[10px] font-bold text-rose-500"><i class="fa-solid fa-power-off block text-lg mb-1"></i>Keluar</button>
          </nav>`,
        );
      }

      const confirmBox = (msg, title = "Konfirmasi Aksi") =>
        new Promise((res) => {
          const m = modal(
            `<h3 class="font-extrabold text-emerald-950 text-lg mb-2">${esc(title)}</h3>
             <p class="mb-6 text-sm text-slate-600 leading-relaxed">${esc(msg)}</p>
             <div class="flex gap-3 justify-end border-t border-slate-100 pt-4">
               <button data-n class="${C.ghost} !px-5 !py-2.5 !text-sm">Batal</button>
               <button data-y class="${C.btn}">Ya, Lanjutkan</button>
             </div>`
          );
          $("[data-n]", m).onclick = () => { m.remove(); res(false); };
          $("[data-y]", m).onclick = () => { m.remove(); res(true); };
        });

      function pager(el, d, go) {
        el.innerHTML = `<div class="flex items-center justify-between mt-5 text-sm">
          <button data-p class="${C.ghost}" ${d.page <= 1 ? "disabled" : ""}>&laquo; Sebelumnya</button>
          <span class="text-slate-500 font-medium">Halaman ${d.page} dari ${d.pages || 1} <span class="mx-2">|</span> Total ${d.total || 0} Data</span>
          <button data-n class="${C.ghost}" ${d.page >= d.pages ? "disabled" : ""}>Selanjutnya &raquo;</button>
        </div>`;
        $("[data-p]", el).onclick = () => go(d.page - 1);
        $("[data-n]", el).onclick = () => go(d.page + 1);
      }
    </script>
  </head>
  <body>
    <main class="max-w-6xl mx-auto p-5 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-black text-emerald-950 tracking-tight">Pesanan Pelanggan</h1>
          <p class="text-sm text-slate-500 font-medium mt-1">Kelola status dan verifikasi pembayaran</p>
        </div>
        <select id="st" class="border border-emerald-200 rounded-xl px-4 py-2.5 text-sm font-bold bg-white text-emerald-900 focus:outline-none focus:ring-2 focus:ring-emerald-400 cursor-pointer shadow-sm">
          <option value="">Semua Status Transaksi</option>
          <option value="pending">Menunggu Verifikasi (Pending)</option>
          <option value="accepted">Telah Diterima (Accepted)</option>
          <option value="rejected">Ditolak (Rejected)</option>
        </select>
      </div>

      <div class="${C.card} overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-emerald-50/60 text-left text-emerald-900 border-b border-emerald-100">
            <tr class="[&>th]:px-5 [&>th]:py-4 [&>th]:font-bold">
              <th>ID</th>
              <th>Produk</th>
              <th>Nominal</th>
              <th>Pembeli</th>
              <th>Status</th>
              <th>Waktu Order</th>
              <th>Tindakan</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-emerald-50"></tbody>
        </table>
      </div>
      <div id="pg"></div>
    </main>

    <script>
      shell("customer-order");
      let page = 1;
      
      const B = {
        pending: "bg-amber-100 text-amber-800 border border-amber-200",
        accepted: "bg-teal-100 text-teal-800 border border-teal-200",
        rejected: "bg-rose-100 text-rose-800 border border-rose-200",
      };

      const translateStatus = (s) => s === 'pending' ? 'Menunggu' : s === 'accepted' ? 'Diterima' : s === 'rejected' ? 'Ditolak' : 'Validasi';

      async function load(p = page) {
        try {
          $("#rows").innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat data...</td></tr>`;
          const d = await api(`/api/admin/orders?page=${p}&limit=10` + ($("#st").value ? "&status=" + $("#st").value : ""));
          
          if (!d.items.length && p > 1) return load(p - 1);
          page = d.page;
          
          $("#rows").innerHTML = d.items.map((o) => `
            <tr class="hover:bg-slate-50/50 transition-colors [&>td]:px-5 [&>td]:py-4 align-middle">
              <td class="font-mono font-bold text-slate-500">#${o.id}</td>
              <td class="font-bold text-emerald-950 max-w-[200px] truncate" title="${esc(o.product_name)}">${esc(o.product_name || "Produk Terhapus")}</td>
              <td class="whitespace-nowrap font-black text-emerald-700">${rp(o.price_paid || 0)}</td>
              <td class="font-medium text-slate-700 capitalize">${esc(o.buyer_name || "Tanpa Nama")}</td>
              <td>
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold inline-block shadow-sm ${B[o.status] || ""}">${esc(translateStatus(o.status))}</span>
                ${o.checksum_ok ? "" : '<div class="mt-1.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-600 text-white shadow-sm"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Harga Bypass</span></div>'}
              </td>
              <td class="whitespace-nowrap text-xs text-slate-500 font-medium">
                ${esc(new Date(o.created_at).toLocaleString("id-ID", { timeZone: "Asia/Makassar", dateStyle: "medium", timeStyle: "short" }) + " WITA")}
              </td>
              <td class="whitespace-nowrap flex items-center gap-2">
                ${o.status !== "accepted" ? `<button data-a="accepted" data-id="${o.id}" class="${C.ghost} !text-teal-700 !bg-teal-50 !border-teal-200 hover:!bg-teal-100" title="Terima Pesanan"><i class="fa-solid fa-check"></i></button>` : ""}
                ${o.status !== "rejected" ? `<button data-a="rejected" data-id="${o.id}" class="${C.ghost} !text-rose-700 !bg-rose-50 !border-rose-200 hover:!bg-rose-100" title="Tolak Pesanan"><i class="fa-solid fa-xmark"></i></button>` : ""}
                <button data-v="${o.id}" class="${C.ghost}" title="Lihat Bukti Transfer"><i class="fa-solid fa-eye mr-1"></i> Detail</button>
                <a href="${esc(o.wa_url || '#')}" target="_blank" rel="noopener" class="${C.ghost} !bg-[#25D366]/10 !border-[#25D366]/30 !text-[#1DA851] hover:!bg-[#25D366]/20" title="Chat WhatsApp"><i class="fa-brands fa-whatsapp text-lg"></i></a>
              </td>
            </tr>
          `).join("") || '<tr><td colspan="7" class="p-10 text-center text-slate-400 font-medium"><i class="fa-solid fa-folder-open text-3xl mb-3 block text-emerald-200"></i>Belum ada pesanan masuk.</td></tr>';
          
          pager($("#pg"), d, load);
        } catch (e) {
          $("#rows").innerHTML = `<tr><td colspan="7" class="p-8 text-center text-rose-500 font-bold">Gagal memuat data.</td></tr>`;
          toast(e.message, false);
        }
      }

      $("#st").onchange = () => load(1);

      $("#rows").onclick = async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        
        if (b.dataset.a) {
          const isReject = b.dataset.a === "rejected";
          if (!(await confirmBox(`Tindakan ini akan mengubah status pesanan #${b.dataset.id} menjadi ${isReject ? 'DITOLAK' : 'DITERIMA'}. Anda yakin ingin melanjutkan?`, "Ubah Status Pesanan"))) return;
          
          try {
            if (isReject) {
              await api(`/api/admin/orders/${b.dataset.id}`, "DELETE");
              toast("Order berhasil dihapus karena ditolak");
            } else {
              await api(`/api/admin/orders/${b.dataset.id}/status`, "PATCH", { status: b.dataset.a });
              toast("Pesanan berhasil diverifikasi dan diterima");
            }
            load();
          } catch (x) { toast(x.message, false); }
        } 
        else if (b.dataset.v) {
          try {
            const o = await api("/api/admin/orders/" + b.dataset.v);
            const m = modal(
              `<div class="flex items-center justify-between mb-4 border-b border-emerald-100 pb-3">
                 <h2 class="font-black text-emerald-950 text-lg">Detail Order #${o.id}</h2>
                 <button data-x class="text-slate-400 hover:text-rose-500 text-xl transition"><i class="fa-solid fa-xmark"></i></button>
               </div>
               <div class="bg-emerald-50/50 rounded-2xl p-4 border border-emerald-100 mb-5">
                 <dl class="text-sm space-y-2.5">
                   ${[
                     ["Nama Produk", esc(o.product_name || "Produk Dihapus")],
                     ["Total Tagihan", `<span class="font-black text-emerald-700 text-base">${rp(o.price_paid || 0)}</span>`],
                     ["Nama Pembeli", `<span class="font-bold text-slate-800 capitalize">${esc(o.buyer_name || "Tanpa Nama")}</span>`],
                     ["No. WhatsApp", esc(o.whatsapp || "-")],
                     ["Bank Tujuan", esc(o.bank_name || "Metode Dihapus")],
                   ].map(([k, v]) => `<div class="flex justify-between items-center gap-3 border-b border-emerald-100/50 pb-1.5 last:border-0 last:pb-0"><dt class="text-slate-500 font-bold">${k}</dt><dd class="text-right text-emerald-950 truncate max-w-[60%]">${v}</dd></div>`).join("")}
                 </dl>
               </div>
               <div class="mb-4">
                 <p class="text-xs uppercase font-extrabold tracking-wide text-slate-400 mb-2">Foto Bukti Transfer</p>
                 <div class="border-2 border-dashed border-emerald-200 rounded-2xl p-2 bg-slate-50 flex items-center justify-center overflow-hidden">
                   ${o.proof_url ? `<img src="${esc(o.proof_url)}" class="w-full max-h-80 object-contain rounded-xl cursor-zoom-in shadow-sm hover:scale-[1.02] transition" alt="Bukti Transfer">` : `<p class="text-slate-400 py-10 text-sm font-medium">Tidak ada foto terlampir.</p>`}
                 </div>
               </div>
               <button data-x class="${C.btn} w-full shadow-lg shadow-emerald-200">Tutup Jendela</button>`
            );
            
            $("[data-x]", m).forEach(btn => btn.onclick = () => m.remove());
            const img = $("img", m);
            if(img) {
              img.onclick = () => {
                const z = modal(`<img src="${esc(o.proof_url)}" class="w-full rounded-xl"><button data-x class="${C.btn} w-full mt-4">Tutup Zoom</button>`, true);
                $("[data-x]", z).onclick = () => z.remove();
              };
            }
          } catch (x) { toast(x.message, false); }
        }
      };
      
      load();
    </script>
  </body>
</html>
