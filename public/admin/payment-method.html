<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rekening Bank | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }</style>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[c]);
      
      const C = {
        inp: "w-full border border-emerald-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 bg-slate-50 transition-all font-medium text-slate-800",
        btn: "bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl px-5 py-2.5 transition disabled:opacity-50",
        ghost: "border border-emerald-200 bg-white text-emerald-700 hover:bg-emerald-50 text-xs font-bold rounded-lg px-3 py-1.5 disabled:opacity-40 transition cursor-pointer",
        card: "bg-white rounded-3xl border border-emerald-100 shadow-sm",
        err: "hidden mb-4 bg-rose-50 text-rose-700 text-sm font-bold rounded-xl px-4 py-3 border border-rose-100",
      };

      function toast(m, ok = true) {
        const t = document.createElement("div");
        t.className = `fixed top-6 right-6 z-[70] max-w-xs px-5 py-3.5 rounded-2xl text-sm font-bold text-white shadow-xl transition-all ${ok ? "bg-teal-600" : "bg-rose-600"}`;
        t.textContent = m;
        document.body.append(t);
        setTimeout(() => t.remove(), 3500);
      }

      function modal(html, wide) {
        const o = document.createElement("div");
        o.className = "fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4";
        o.innerHTML = `<div class="bg-white w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">${html}</div>`;
        document.body.append(o);
        o.addEventListener("mousedown", (e) => { if (e.target === o) o.remove(); });
        return o;
      }

      const showErr = (m, msg) => { const e = $("[data-er]", m); e.textContent = msg; e.classList.remove("hidden"); };

      async function api(url, method = "GET", body) {
        const r = await fetch(url, {
          method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
        });
        if (r.status === 401) { location.href = "/signin"; throw new Error("Sesi berakhir"); }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(j.error || "Terjadi kesalahan"); e.status = r.status; throw e; }
        return j;
      }

      async function logout() { await fetch("/api/auth/logout", { method: "POST" }); location.href = "/signin"; }

      const NAV = [
        ["dashboard", "fa-chart-pie", "Dashboard"],
        ["product-management", "fa-boxes-stacked", "Katalog Produk"],
        ["customer-order", "fa-receipt", "Pesanan"],
        ["payment-method", "fa-building-columns", "Rekening Bank"],
        ["testimonial", "fa-comments", "Testimoni"],
      ];

      function shell(active) {
        const side = NAV.map(
          ([n, i, t]) => `<a href="/${n}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${n === active ? "bg-emerald-100/60 text-emerald-800" : "text-slate-600 hover:bg-slate-50 hover:text-emerald-700"}"><i class="fa-solid ${i} w-5 text-center"></i>${t}</a>`,
        ).join("");
        const bot = NAV.map(
          ([n, i, t]) => `<a href="/${n}" class="flex-1 py-3 text-center text-[10px] font-bold transition-all ${n === active ? "text-emerald-700 bg-emerald-50/50" : "text-slate-400"}"><i class="fa-solid ${i} block text-lg mb-1"></i>${t}</a>`,
        ).join("");
        document.body.classList.add("bg-slate-50", "text-slate-800", "min-h-screen", "md:ml-64", "pb-20", "md:pb-0");
        document.body.insertAdjacentHTML(
          "afterbegin",
          `<aside class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-white border-r border-emerald-100 flex-col p-5 gap-2 shadow-sm">
            <div class="flex items-center gap-3 mb-6 px-2">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-leaf"></i></div>
              <b class="text-emerald-950 text-xl tracking-tight">Admin Area</b>
            </div>
            ${side}
            <button onclick="logout()" class="mt-auto text-left px-4 py-3 text-sm font-bold text-rose-600 hover:bg-rose-50 rounded-2xl transition"><i class="fa-solid fa-power-off mr-2"></i>Keluar Sistem</button>
          </aside>
          <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-emerald-100 flex shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            ${bot}
            <button onclick="logout()" class="flex-1 py-3 text-center text-[10px] font-bold text-rose-500"><i class="fa-solid fa-power-off block text-lg mb-1"></i>Keluar</button>
          </nav>`,
        );
      }

      const confirmBox = (msg, title = "Konfirmasi Aksi") =>
        new Promise((res) => {
          const m = modal(
            `<h3 class="font-extrabold text-emerald-950 text-lg mb-2">${esc(title)}</h3>
             <p class="mb-6 text-sm text-slate-600 leading-relaxed">${esc(msg)}</p>
             <div class="flex gap-3 justify-end border-t border-slate-100 pt-4">
               <button data-n class="${C.ghost} !px-5 !py-2.5 !text-sm">Batal</button>
               <button data-y class="${C.btn}">Ya, Lanjutkan</button>
             </div>`
          );
          $("[data-n]", m).onclick = () => { m.remove(); res(false); };
          $("[data-y]", m).onclick = () => { m.remove(); res(true); };
        });
    </script>
  </head>
  <body>
    <main class="max-w-4xl mx-auto p-5 md:p-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-black text-emerald-950 tracking-tight">Rekening Pembayaran</h1>
          <p class="text-sm text-slate-500 font-medium mt-1">Atur tujuan transfer untuk pelanggan checkout</p>
        </div>
        <button id="add" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl px-5 py-2.5 transition disabled:opacity-50 flex items-center justify-center gap-2 shadow-lg shadow-emerald-200">
          <i class="fa-solid fa-plus"></i> Tambah Rekening
        </button>
      </div>

      <div class="bg-white rounded-3xl border border-emerald-100 shadow-sm overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-emerald-50/60 text-left text-emerald-900 border-b border-emerald-100">
            <tr class="[&>th]:px-5 [&>th]:py-4 [&>th]:font-bold">
              <th>Nama Bank / E-Wallet</th>
              <th>Nomor Rekening</th>
              <th>Atas Nama</th>
              <th>Tindakan</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-emerald-50"></tbody>
        </table>
      </div>
    </main>

    <script>
      shell("payment-method");
      let rows = [];

      async function load() {
        try {
          $("#rows").innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat rekening...</td></tr>`;
          rows = await api("/api/admin/payment-methods");
          
          $("#rows").innerHTML = rows.map((r) => `
            <tr class="hover:bg-slate-50/50 transition-colors [&>td]:px-5 [&>td]:py-4 align-middle">
              <td class="font-bold text-emerald-950 uppercase">${esc(r.bank_name || '-')}</td>
              <td class="font-mono font-bold text-slate-600 tracking-wider">${esc(r.account_number || '-')}</td>
              <td class="font-medium text-slate-700 capitalize">${esc(r.account_holder || '-')}</td>
              <td class="whitespace-nowrap space-x-2">
                <button data-e="${r.id}" class="${C.ghost}" title="Edit Data"><i class="fa-solid fa-pen"></i></button>
                <button data-d="${r.id}" class="${C.ghost} !text-rose-600 !bg-rose-50 !border-rose-200 hover:!bg-rose-100" title="Hapus"><i class="fa-solid fa-trash-can"></i></button>
              </td>
            </tr>
          `).join("") || '<tr><td colspan="4" class="p-10 text-center text-slate-400 font-medium"><i class="fa-solid fa-building-columns text-3xl mb-3 block text-emerald-200"></i>Belum ada rekening tujuan.</td></tr>';
        } catch (e) {
          $("#rows").innerHTML = `<tr><td colspan="4" class="p-8 text-center text-rose-500 font-bold">Gagal mengambil data.</td></tr>`;
          toast(e.message, false);
        }
      }

      function formBank(title, d = {}, saveCallback) {
        const m = modal(
          `<div class="flex items-center justify-between mb-4 border-b border-emerald-100 pb-3">
             <h2 class="font-black text-emerald-950 text-xl">${esc(title)}</h2>
             <button data-x class="text-slate-400 hover:text-rose-500 text-xl transition"><i class="fa-solid fa-xmark"></i></button>
           </div>
           <div data-er class="${C.err}"></div>
           
           <div class="space-y-4">
             <label class="block font-bold text-emerald-950">Nama Bank / E-Wallet
               <input name="bank_name" maxlength="50" value="${esc(d.bank_name || '')}" placeholder="Contoh: BCA / DANA..." class="${C.inp} mt-1.5 uppercase">
             </label>
             <label class="block font-bold text-emerald-950">Nomor Rekening
               <input name="account_number" maxlength="50" value="${esc(d.account_number || '')}" placeholder="Ketik nomor rekening..." class="${C.inp} mt-1.5 font-mono">
             </label>
             <label class="block font-bold text-emerald-950">Nama Pemilik Rekening
               <input name="account_holder" maxlength="100" value="${esc(d.account_holder || '')}" placeholder="Atas nama..." class="${C.inp} mt-1.5 capitalize">
             </label>
           </div>
           
           <div class="flex gap-3 justify-end mt-6 pt-4 border-t border-emerald-100">
             <button data-x class="${C.ghost} !px-6 !py-3">Batalkan</button>
             <button data-s class="${C.btn} !px-8 !py-3 shadow-lg shadow-emerald-200">Simpan Rekening</button>
           </div>`
        );
        
        m.querySelectorAll("[data-x]").forEach(btn => btn.onclick = () => m.remove());
        
        $("[data-s]", m).onclick = async (e) => {
          const btn = e.target;
          const payload = {
            bank_name: $(`[name=bank_name]`, m).value.trim(),
            account_number: $(`[name=account_number]`, m).value.trim(),
            account_holder: $(`[name=account_holder]`, m).value.trim()
          };
          
          if(!payload.bank_name || !payload.account_number || !payload.account_holder) return showErr(m, "Semua kolom data rekening wajib diisi!");
          
          btn.disabled = true; btn.textContent = "Menyimpan...";
          try {
            await saveCallback(payload);
            m.remove();
          } catch (x) { showErr(m, x.message); btn.disabled = false; btn.textContent = "Simpan Rekening"; }
        };
      }

      $("#add").onclick = () => formBank("Tambah Rekening Baru", {}, async (b) => {
        await api("/api/admin/payment-methods", "POST", b);
        toast("Rekening berhasil ditambahkan!"); load();
      });

      $("#rows").onclick = async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        
        if (b.dataset.e) {
          const r = rows.find((x) => x.id == b.dataset.e);
          formBank("Perbarui Rekening", r, async (d) => {
            await api("/api/admin/payment-methods/" + r.id, "PUT", d);
            toast("Data rekening berhasil diperbarui!"); load();
          });
        } else if (await confirmBox("Menghapus rekening ini akan menghilangkannya dari halaman checkout pelanggan.", "Hapus Rekening?")) {
          try {
            await api("/api/admin/payment-methods/" + b.dataset.d, "DELETE");
            toast("Rekening berhasil dihapus."); load();
          } catch (x) { toast(x.message, false); }
        }
      };
      
      load();
    </script>
  </body>
</html>
