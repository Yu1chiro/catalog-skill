<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Katalog Produk | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" />
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <style>
      body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .ql-toolbar { border-radius: 0.75rem 0.75rem 0 0 !important; border-color: #a7f3d0 !important; background-color: #f8fafc; }
      .ql-container { border-radius: 0 0 0.75rem 0.75rem !important; border-color: #a7f3d0 !important; font-family: inherit; font-size: 0.875rem; min-height: 120px; }
      .ql-editor { color: #1e293b; font-weight: 500; }
    </style>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[c]);
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
      
      const C = {
        inp: "w-full border border-emerald-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 bg-slate-50 transition-all font-medium text-slate-800",
        btn: "bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl px-5 py-2.5 transition disabled:opacity-50",
        ghost: "border border-emerald-200 bg-white text-emerald-700 hover:bg-emerald-50 text-xs font-bold rounded-lg px-3 py-1.5 disabled:opacity-40 transition cursor-pointer",
        card: "bg-white rounded-3xl border border-emerald-100 shadow-sm",
        err: "hidden mb-4 bg-rose-50 text-rose-700 text-sm font-bold rounded-xl px-4 py-3 border border-rose-100",
      };

      function toast(m, ok = true) {
        const t = document.createElement("div");
        t.className = `fixed top-6 right-6 z-[70] max-w-xs px-5 py-3.5 rounded-2xl text-sm font-bold text-white shadow-xl transition-all ${ok ? "bg-teal-600" : "bg-rose-600"}`;
        t.textContent = m;
        document.body.append(t);
        setTimeout(() => t.remove(), 3500);
      }

      function modal(html, wide) {
        const o = document.createElement("div");
        o.className = "fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4";
        o.innerHTML = `<div class="bg-white w-full ${wide ? "sm:max-w-3xl" : "sm:max-w-md"} max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">${html}</div>`;
        document.body.append(o);
        o.addEventListener("mousedown", (e) => { if (e.target === o) o.remove(); });
        return o;
      }

      const showErr = (m, msg) => { const e = $("[data-er]", m); e.textContent = msg; e.classList.remove("hidden"); };

      function compress(file, max = 1600) {
        return new Promise((ok, no) => {
          const img = new Image();
          img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            let q = 0.9, d;
            do { d = c.toDataURL("image/jpeg", q); q -= 0.1; } while (d.length > 2.6e6 && q > 0.2);
            d.length > 2.9e6 ? no(new Error("Gambar terlalu besar")) : ok(d);
          };
          img.onerror = () => no(new Error("File bukan gambar valid"));
          img.src = URL.createObjectURL(file);
        });
      }

      async function uploadImage(file) {
        if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) throw new Error("Hanya file PNG/JPG yang diizinkan");
        const data = await compress(file);
        const r = await fetch("/api/upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data, name: file.name }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || "Upload ke server gagal");
        return j.url;
      }

      async function api(url, method = "GET", body) {
        const r = await fetch(url, {
          method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (r.status === 401) { location.href = "/signin"; throw new Error("Sesi berakhir"); }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { const e = new Error(j.error || "Terjadi kesalahan"); e.status = r.status; throw e; }
        return j;
      }

      async function logout() { await fetch("/api/auth/logout", { method: "POST" }); location.href = "/signin"; }

      const NAV = [
        ["dashboard", "fa-chart-pie", "Dashboard"],
        ["product-management", "fa-boxes-stacked", "Katalog Produk"],
        ["customer-order", "fa-receipt", "Pesanan"],
        ["payment-method", "fa-building-columns", "Rekening Bank"],
        ["testimonial", "fa-comments", "Testimoni"],
      ];

      function shell(active) {
        const side = NAV.map(
          ([n, i, t]) => `<a href="/${n}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${n === active ? "bg-emerald-100/60 text-emerald-800" : "text-slate-600 hover:bg-slate-50 hover:text-emerald-700"}"><i class="fa-solid ${i} w-5 text-center"></i>${t}</a>`,
        ).join("");
        const bot = NAV.map(
          ([n, i, t]) => `<a href="/${n}" class="flex-1 py-3 text-center text-[10px] font-bold transition-all ${n === active ? "text-emerald-700 bg-emerald-50/50" : "text-slate-400"}"><i class="fa-solid ${i} block text-lg mb-1"></i>${t}</a>`,
        ).join("");
        document.body.classList.add("bg-slate-50", "text-slate-800", "min-h-screen", "md:ml-64", "pb-20", "md:pb-0");
        document.body.insertAdjacentHTML(
          "afterbegin",
          `<aside class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-white border-r border-emerald-100 flex-col p-5 gap-2 shadow-sm">
            <div class="flex items-center gap-3 mb-6 px-2">
              <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-leaf"></i></div>
              <b class="text-emerald-950 text-xl tracking-tight">Admin Area</b>
            </div>
            ${side}
            <button onclick="logout()" class="mt-auto text-left px-4 py-3 text-sm font-bold text-rose-600 hover:bg-rose-50 rounded-2xl transition"><i class="fa-solid fa-power-off mr-2"></i>Keluar Sistem</button>
          </aside>
          <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-emerald-100 flex shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            ${bot}
            <button onclick="logout()" class="flex-1 py-3 text-center text-[10px] font-bold text-rose-500"><i class="fa-solid fa-power-off block text-lg mb-1"></i>Keluar</button>
          </nav>`,
        );
      }

      const confirmBox = (msg, title = "Konfirmasi Aksi") =>
        new Promise((res) => {
          const m = modal(
            `<h3 class="font-extrabold text-emerald-950 text-lg mb-2">${esc(title)}</h3>
             <p class="mb-6 text-sm text-slate-600 leading-relaxed">${esc(msg)}</p>
             <div class="flex gap-3 justify-end border-t border-slate-100 pt-4">
               <button data-n class="${C.ghost} !px-5 !py-2.5 !text-sm">Batal</button>
               <button data-y class="${C.btn}">Ya, Lanjutkan</button>
             </div>`
          );
          $("[data-n]", m).onclick = () => { m.remove(); res(false); };
          $("[data-y]", m).onclick = () => { m.remove(); res(true); };
        });

      function pager(el, d, go) {
        el.innerHTML = `<div class="flex items-center justify-between mt-5 text-sm">
          <button data-p class="${C.ghost}" ${d.page <= 1 ? "disabled" : ""}>&laquo; Sebelumnya</button>
          <span class="text-slate-500 font-medium">Halaman ${d.page} dari ${d.pages || 1} <span class="mx-2">|</span> Total ${d.total || 0} Data</span>
          <button data-n class="${C.ghost}" ${d.page >= d.pages ? "disabled" : ""}>Selanjutnya &raquo;</button>
        </div>`;
        $("[data-p]", el).onclick = () => go(d.page - 1);
        $("[data-n]", el).onclick = () => go(d.page + 1);
      }
    </script>
  </head>
  <body>
    <main class="max-w-6xl mx-auto p-5 md:p-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-black text-emerald-950 tracking-tight">Katalog Produk</h1>
          <p class="text-sm text-slate-500 font-medium mt-1">Buat, perbarui, dan atur ketersediaan e-book</p>
        </div>
        <button id="add" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl px-5 py-2.5 transition disabled:opacity-50 flex items-center gap-2 shadow-lg shadow-emerald-200">
          <i class="fa-solid fa-plus"></i> Tambah Produk Baru
        </button>
      </div>

      <div class="bg-white rounded-3xl border border-emerald-100 shadow-sm overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-emerald-50/60 text-left text-emerald-900 border-b border-emerald-100">
            <tr class="[&>th]:px-5 [&>th]:py-4 [&>th]:font-bold">
              <th>Gambar</th>
              <th>Nama Produk</th>
              <th>Kategori</th>
              <th>Harga Jual</th>
              <th>Status</th>
              <th>Aktif</th>
              <th>Tindakan</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-emerald-50"></tbody>
        </table>
      </div>
      <div id="pg"></div>
    </main>

    <script>
      shell("product-management");
      let page = 1, list = [];

      async function load(p = page) {
        try {
          $("#rows").innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400 font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat katalog...</td></tr>`;
          const d = await api(`/api/admin/products?page=${p}&limit=10`);
          if (!d.items.length && p > 1) return load(p - 1);
          page = d.page; list = d.items || [];
          
          $("#rows").innerHTML = list.map((p) => `
            <tr class="hover:bg-slate-50/50 transition-colors [&>td]:px-5 [&>td]:py-3 align-middle">
              <td>
                <div class="w-14 aspect-[4/5] rounded-xl border border-emerald-100 bg-white overflow-hidden p-1 shadow-sm">
                  <img src="${esc(p.thumbnail_url)}" class="w-full h-full object-cover rounded-lg" alt="thumb">
                </div>
              </td>
              <td class="font-bold text-emerald-950 max-w-[200px] truncate" title="${esc(p.name)}">${esc(p.name || 'Produk Tanpa Nama')}</td>
              <td>
                <div class="flex flex-wrap gap-1 max-w-[150px]">
                  ${Array.isArray(p.categories) && p.categories.length > 0 
                    ? p.categories.slice(0,2).map(c => `<span class="bg-teal-50 border border-teal-100 text-teal-800 rounded-md px-1.5 py-0.5 text-[10px] font-bold">${esc(c)}</span>`).join("") + (p.categories.length > 2 ? `<span class="text-[10px] text-slate-400">...</span>` : "")
                    : '<span class="text-xs text-slate-400 italic">Kosong</span>'}
                </div>
              </td>
              <td class="whitespace-nowrap font-black text-emerald-700">${rp(p.final_price || 0)}</td>
              <td class="capitalize font-medium text-slate-600">${esc(p.status || 'Terbaru')}</td>
              <td>
                ${p.is_active ? '<span class="text-teal-600 bg-teal-50 px-2.5 py-1 rounded-lg text-xs font-bold border border-teal-200">Ya</span>' : '<span class="text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg text-xs font-bold border border-slate-200">Tidak</span>'}
              </td>
              <td class="whitespace-nowrap flex gap-2">
                <button data-e="${p.id}" class="${C.ghost}" title="Edit Data"><i class="fa-solid fa-pen"></i></button>
                <button data-d="${p.id}" class="${C.ghost} !text-rose-600 !bg-rose-50 !border-rose-200 hover:!bg-rose-100" title="Hapus"><i class="fa-solid fa-trash-can"></i></button>
              </td>
            </tr>
          `).join("") || '<tr><td colspan="7" class="p-10 text-center text-slate-400 font-medium"><i class="fa-solid fa-box-open text-3xl mb-3 block text-emerald-200"></i>Katalog masih kosong.</td></tr>';
          
          pager($("#pg"), d, load);
        } catch (e) {
          $("#rows").innerHTML = `<tr><td colspan="7" class="p-8 text-center text-rose-500 font-bold">Gagal memuat katalog.</td></tr>`;
          toast(e.message, false);
        }
      }

      function form(p) {
        const edit = !!p; p = p || {};
        let cats = Array.isArray(p.categories) ? [...p.categories] : [];
        let thumb = p.thumbnail_url || "";
        
        const m = modal(
          `<div class="flex items-center justify-between mb-4 border-b border-emerald-100 pb-3">
             <h2 class="font-black text-emerald-950 text-xl">${edit ? "Perbarui" : "Tambah"} E-Book / Produk</h2>
             <button data-x class="text-slate-400 hover:text-rose-500 text-xl transition"><i class="fa-solid fa-xmark"></i></button>
           </div>
           <div data-er class="${C.err}"></div>
           
           <div class="grid grid-cols-1 md:grid-cols-2 gap-5 text-sm">
             <div class="space-y-4 md:col-span-2">
               <label class="block font-bold text-emerald-950">Nama E-Book / Produk<input name="name" maxlength="120" value="${esc(p.name || '')}" placeholder="Ketik nama lengkap produk..." class="${C.inp} mt-1.5"></label>
             </div>
             
             <div class="space-y-4 border-r border-emerald-50 pr-4">
               <div>
                 <label class="block font-bold text-emerald-950 mb-1.5">Kategori (Label)</label>
                 <div class="flex border border-emerald-200 bg-white rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-400 transition-all p-1">
                   <input id="cin" placeholder="Ketik label lalu tekan Enter..." class="w-full bg-transparent px-3 py-2 text-sm outline-none font-medium text-slate-800">
                 </div>
                 <div id="chips" class="flex flex-wrap gap-2 mt-2 min-h-[30px]"></div>
               </div>
               
               <div class="grid grid-cols-2 gap-3">
                 <label class="block font-bold text-emerald-950">Harga Dasar (Rp)<input name="price" inputmode="numeric" value="${p.price ? Number(p.price).toLocaleString("id-ID") : ""}" placeholder="Contoh: 150000" class="${C.inp} mt-1.5"></label>
                 <label class="block font-bold text-emerald-950">Diskon (%)<input name="discount_percent" type="number" min="0" max="100" value="${p.discount_percent || 0}" class="${C.inp} mt-1.5"></label>
               </div>
               <p id="est" class="text-[11px] font-bold text-teal-600 bg-teal-50 px-3 py-2 rounded-lg border border-teal-100"></p>
               
               <label class="block font-bold text-emerald-950">Urutan Tampil<select name="status" class="${C.inp} mt-1.5 cursor-pointer"><option value="terbaru">Terbaru (Di Atas)</option><option value="terlama">Terlama (Di Bawah)</option></select></label>
               
               <label class="block font-bold text-emerald-950">Rekayasa Angka Pembeli<input name="manual_buyers" type="number" min="0" value="${p.manual_buyers || 0}" class="${C.inp} mt-1.5"></label>
             </div>
             
             <div class="space-y-4 pl-0 md:pl-2">
               <div>
                 <label class="block font-bold text-emerald-950 mb-1.5">Foto Sampul Utama</label>
                 <div class="border-2 border-dashed border-emerald-200 bg-slate-50 rounded-xl p-3 text-center cursor-pointer hover:bg-emerald-50 transition relative">
                   <input id="tf" type="file" accept="image/png,image/jpeg,image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                   <span class="text-emerald-600 font-bold text-xs flex items-center justify-center gap-2"><i class="fa-solid fa-cloud-arrow-up"></i> Klik untuk Unggah</span>
                 </div>
                 <div class="${thumb ? "" : "hidden"} mt-3 border border-emerald-100 rounded-xl p-1 bg-white shadow-sm inline-block">
                   <img id="tp" src="${esc(thumb)}" class="h-24 w-auto rounded-lg object-contain">
                 </div>
               </div>
               
               <div>
                 <label class="block font-bold text-emerald-950 flex items-center justify-between mb-1.5">Galeri (Opsional) <button type="button" id="ga" class="${C.ghost} !py-1 !text-[10px]">+ Tambah</button></label>
                 <div id="gal" class="space-y-2 mt-1"></div>
               </div>
               
               <label class="block font-bold text-emerald-950">Tautan Unduhan / Eksternal (Opsional)<input name="product_link" value="${esc(p.product_link || '')}" placeholder="https://drive.google.com/..." class="${C.inp} mt-1.5 text-xs"></label>
             </div>
             
             <div class="md:col-span-2 pt-2">
               <label class="block font-bold text-emerald-950 mb-1.5">Deskripsi Panjang E-Book</label>
               <div class="bg-white rounded-xl shadow-sm"><div id="ed"></div></div>
             </div>
             
             <div class="md:col-span-2 border-t border-slate-100 pt-4 pb-2">
               <label class="flex items-center gap-3 cursor-pointer bg-slate-50 p-3 rounded-xl border border-slate-200 w-max hover:border-emerald-300 transition">
                 <div class="relative flex items-center">
                   <input type="checkbox" name="is_active" class="sr-only peer" ${p.is_active !== false ? "checked" : ""}>
                   <div class="w-12 h-6 bg-slate-300 peer-checked:bg-emerald-500 rounded-full transition-colors"></div>
                   <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-6 shadow-sm"></div>
                 </div>
                 <span class="font-bold text-slate-700 select-none">Tampilkan ke Publik (Aktif)</span>
               </label>
             </div>
           </div>
           
           <div class="flex gap-3 justify-end mt-4 pt-4 border-t border-emerald-100">
             <button data-x class="${C.ghost} !px-6 !py-3">Batalkan</button>
             <button data-s class="${C.btn} !px-8 !py-3 shadow-lg shadow-emerald-200">Simpan Data</button>
           </div>`,
          true
        );

        const f = (n) => $(`[name=${n}]`, m), raw = () => f("price").value.replace(/\D/g, "");
        f("status").value = p.status || "terbaru";
        
        const chips = () => {
          $("#chips", m).innerHTML = cats.map((c, i) => `<span class="bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-lg px-2.5 py-1 text-xs font-bold flex items-center gap-1 shadow-sm">${esc(c)} <button type="button" data-i="${i}" class="text-emerald-500 hover:text-rose-500 leading-none text-sm">&times;</button></span>`).join("");
        };
        chips();
        
        $("#chips", m).onclick = (e) => {
          const b = e.target.closest("[data-i]");
          if (b) { cats.splice(+b.dataset.i, 1); chips(); }
        };
        
        $("#cin", m).onkeydown = (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          const v = e.target.value.trim();
          if (v && !cats.includes(v) && cats.length < 8) { cats.push(v); chips(); }
          e.target.value = "";
        };

        const row = (v = "") => {
          const d = document.createElement("div"); d.className = "flex gap-2";
          d.innerHTML = `<input class="${C.inp} g !py-2 !text-xs" placeholder="URL Foto Tambahan..." value="${esc(v)}"><button type="button" class="bg-rose-50 border border-rose-200 text-rose-500 hover:bg-rose-100 px-3 rounded-xl transition text-sm"><i class="fa-solid fa-xmark"></i></button>`;
          $("button", d).onclick = () => d.remove();
          $("#gal", m).append(d);
        };
        (Array.isArray(p.gallery) ? p.gallery : []).forEach(row);
        $("#ga", m).onclick = () => row();

        const est = () => {
          const pr = +raw() || 0, d = Math.min(100, +f("discount_percent").value || 0);
          const final = Math.round((pr * (100 - d)) / 100);
          $("#est", m).innerHTML = pr ? `<i class="fa-solid fa-tag mr-1"></i> Harga Final Tayang: <b>${rp(final)}</b>` : `<i class="fa-solid fa-info-circle mr-1"></i> Masukkan harga dasar terlebih dahulu`;
        };
        
        f("price").oninput = (e) => {
          const v = raw();
          e.target.value = v ? Number(v).toLocaleString("id-ID") : "";
          est();
        };
        f("discount_percent").oninput = est; est();

        const save = $("[data-s]", m);
        $("#tf", m).onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          save.disabled = true; save.textContent = "Mengunggah Foto...";
          try {
            thumb = await uploadImage(file);
            const i = $("#tp", m); i.src = thumb; i.parentElement.classList.remove("hidden");
          } catch (x) { showErr(m, x.message); }
          save.disabled = false; save.textContent = "Simpan Data";
        };

        const q = new Quill($("#ed", m), {
          theme: "snow", placeholder: "Tuliskan deskripsi produk yang menarik...",
          modules: { toolbar: [ [{ font: [] }, { size: ["small", false, "large"] }], ["bold", "italic", "underline", "strike"], [{ color: [] }, { background: [] }], [{ header: [2, 3, false] }], [{ list: "ordered" }, { list: "bullet" }], [{ align: [] }], ["link"], ["clean"] ] },
        });
        q.root.innerHTML = p.description || "";

        m.querySelectorAll("[data-x]").forEach(btn => btn.onclick = () => m.remove());
        
        save.onclick = async () => {
          if (!f("name").value.trim()) return showErr(m, "Nama produk wajib diisi");
          if (!thumb) return showErr(m, "Foto sampul wajib diunggah");
          
          save.disabled = true; save.textContent = "Menyimpan...";
          const body = {
            name: f("name").value, categories: cats, status: f("status").value,
            thumbnail_url: thumb, gallery: [...m.querySelectorAll(".g")].map((i) => i.value.trim()).filter(Boolean),
            price: raw(), discount_percent: f("discount_percent").value || 0,
            manual_buyers: parseInt(f("manual_buyers").value) || 0,
            description: q.getText().trim() ? q.root.innerHTML : "",
            product_link: f("product_link").value, is_active: f("is_active").checked,
          };
          
          try {
            await api(edit ? "/api/admin/products/" + p.id : "/api/admin/products", edit ? "PUT" : "POST", body);
            m.remove(); toast("Data katalog berhasil disimpan!"); load();
          } catch (x) { showErr(m, x.message); save.disabled = false; save.textContent = "Simpan Data"; }
        };
      }

      $("#add").onclick = () => form();
      $("#rows").onclick = async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        
        if (b.dataset.e) {
          form(list.find((x) => x.id == b.dataset.e));
        } else if (await confirmBox("Data produk yang dihapus tidak dapat dikembalikan. Jika produk ini pernah dibeli, kami sarankan Anda cukup 'Menonaktifkan' produk saja via Edit. Tetap hapus permanen?", "Peringatan Penghapusan")) {
          try {
            await api("/api/admin/products/" + b.dataset.d, "DELETE");
            toast("Data berhasil dihapus selamanya"); load();
          } catch (x) {
            toast(x.status === 409 ? "Gagal: Produk ini sudah memiliki rekaman pesanan (Order). Mohon matikan toggle 'Tampilkan Publik' saja." : x.message, false);
          }
        }
      };
      
      load();
    </script>
  </body>
</html>
