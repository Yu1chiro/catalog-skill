<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Produk | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
      const C = {
        inp: "w-full border border-sky-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 bg-white",
        btn: "bg-sky-500 hover:bg-sky-600 text-white text-sm font-semibold rounded-xl px-4 py-2 transition disabled:opacity-50",
        ghost:
          "border border-sky-200 text-sky-700 hover:bg-sky-50 text-xs rounded-lg px-3 py-1.5 disabled:opacity-40",
        card: "bg-white rounded-2xl border border-sky-100 shadow-sm",
        err: "hidden mb-3 bg-rose-50 text-rose-600 text-sm rounded-xl px-3 py-2",
      };
      function toast(m, ok = true) {
        const t = document.createElement("div");
        t.className = `fixed top-4 right-4 z-[70] max-w-xs px-4 py-3 rounded-xl text-sm text-white shadow-lg ${ok ? "bg-emerald-500" : "bg-rose-500"}`;
        t.textContent = m;
        document.body.append(t);
        setTimeout(() => t.remove(), 3500);
      }
      function modal(html, wide) {
        const o = document.createElement("div");
        o.className =
          "fixed inset-0 z-50 bg-slate-900/40 flex items-end sm:items-center justify-center sm:p-4";
        o.innerHTML = `<div class="bg-white w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5">${html}</div>`;
        document.body.append(o);
        o.addEventListener("mousedown", (e) => {
          if (e.target === o) o.remove();
        });
        return o;
      }
      const showErr = (m, msg) => {
        const e = $("[data-er]", m);
        e.textContent = msg;
        e.classList.remove("hidden");
      };
      function compress(file, max = 1600) {
        return new Promise((ok, no) => {
          const img = new Image();
          img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height)),
              c = document.createElement("canvas");
            c.width = Math.round(img.width * k);
            c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            let q = 0.9,
              d;
            do {
              d = c.toDataURL("image/jpeg", q);
              q -= 0.1;
            } while (d.length > 2.6e6 && q > 0.2);
            d.length > 2.9e6 ? no(new Error("Gambar terlalu besar")) : ok(d);
          };
          img.onerror = () => no(new Error("File bukan gambar valid"));
          img.src = URL.createObjectURL(file);
        });
      }
      async function uploadImage(file) {
        if (!/^image\/(png|jpe?g|webp)$/.test(file.type))
          throw new Error("Hanya PNG/JPG/WEBP");
        const data = await compress(file);
        const r = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data, name: file.name }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || "Upload gagal");
        return j.url;
      }
      async function api(url, method = "GET", body) {
        const r = await fetch(url, {
          method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (r.status === 401) {
          location.href = "/signin";
          throw new Error("Sesi berakhir");
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          const e = new Error(j.error || "Terjadi kesalahan");
          e.status = r.status;
          throw e;
        }
        return j;
      }
      async function logout() {
        await fetch("/api/auth/logout", { method: "POST" });
        location.href = "/signin";
      }
      const NAV = [
        ["dashboard", "fa-chart-line", "Dashboard"],
        ["product-management", "fa-box", "Produk"],
        ["customer-order", "fa-receipt", "Order"],
        ["payment-method", "fa-credit-card", "Rekening"],
        ["testimonial", "fa-comments", "Testimoni"],
      ];
      function shell(active) {
        const side = NAV.map(
          ([n, i, t]) =>
            `<a href="/${n}" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm ${n === active ? "bg-sky-100 text-sky-800 font-bold" : "hover:bg-sky-50"}"><i class="fa-solid ${i} w-4"></i>${t}</a>`,
        ).join("");
        const bot = NAV.map(
          ([n, i, t]) =>
            `<a href="/${n}" class="flex-1 py-2 text-center text-[10px] ${n === active ? "text-sky-600 font-bold" : "text-slate-400"}"><i class="fa-solid ${i} block text-base mb-0.5"></i>${t}</a>`,
        ).join("");
        document.body.classList.add(
          "bg-sky-50",
          "text-slate-700",
          "min-h-screen",
          "md:ml-56",
          "pb-20",
          "md:pb-0",
        );
        document.body.insertAdjacentHTML(
          "afterbegin",
          `<aside class="hidden md:flex fixed inset-y-0 left-0 w-56 bg-white border-r border-sky-100 flex-col p-4 gap-1"><b class="text-sky-900 text-lg mb-4">Skills Admin</b>${side}<button onclick="logout()" class="mt-auto text-left px-3 py-2 text-sm text-rose-500"><i class="fa-solid fa-right-from-bracket mr-2"></i>Logout</button></aside>
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t border-sky-100 flex">${bot}<button onclick="logout()" class="flex-1 py-2 text-center text-[10px] text-rose-500"><i class="fa-solid fa-right-from-bracket block text-base mb-0.5"></i>Keluar</button></nav>`,
        );
      }
      const confirmBox = (msg) =>
        new Promise((res) => {
          const m = modal(
            `<p class="mb-4 text-sm">${esc(msg)}</p><div class="flex gap-2 justify-end"><button data-n class="${C.ghost}">Batal</button><button data-y class="${C.btn}">Ya, lanjut</button></div>`,
          );
          $("[data-n]", m).onclick = () => {
            m.remove();
            res(false);
          };
          $("[data-y]", m).onclick = () => {
            m.remove();
            res(true);
          };
        });
      function pager(el, d, go) {
        el.innerHTML = `<div class="flex items-center justify-between mt-4 text-sm"><button data-p class="${C.ghost}" ${d.page <= 1 ? "disabled" : ""}>&laquo; Previous</button><span class="text-slate-500">Hal ${d.page} / ${d.pages} | ${d.total} data</span><button data-n class="${C.ghost}" ${d.page >= d.pages ? "disabled" : ""}>Next &raquo;</button></div>`;
        $("[data-p]", el).onclick = () => go(d.page - 1);
        $("[data-n]", el).onclick = () => go(d.page + 1);
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  </head>
  <body>
    <main class="max-w-6xl mx-auto p-4">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-xl font-extrabold text-sky-900">Manajemen Produk</h1>
        <button
          id="add"
          class="bg-sky-500 hover:bg-sky-600 text-white text-sm font-semibold rounded-xl px-4 py-2"
        >
          + Tambah produk
        </button>
      </div>
      <div class="bg-white rounded-2xl border border-sky-100 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-sky-50 text-left text-sky-800">
            <tr class="[&>th]:p-3">
              <th>Thumbnail</th>
              <th>Nama</th>
              <th>Kategori</th>
              <th>Harga final</th>
              <th>Status</th>
              <th>Aktif</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="pg"></div>
    </main>
    <script>
      shell("product-management");
      let page = 1,
        list = [];
      async function load(p = page) {
        try {
          const d = await api(`/api/admin/products?page=${p}&limit=10`);
          if (!d.items.length && p > 1) return load(p - 1);
          page = d.page;
          list = d.items;
          $("#rows").innerHTML =
            list
              .map(
                (p) =>
                  `<tr class="border-t border-sky-50 [&>td]:p-3 align-middle"><td><img src="${esc(p.thumbnail_url)}" class="w-16 h-10 object-cover rounded-lg bg-sky-100"></td><td class="font-semibold">${esc(p.name)}</td><td>${p.categories.map((c) => `<span class="inline-block bg-sky-100 text-sky-700 rounded-md px-1.5 text-xs mr-1">${esc(c)}</span>`).join("")}</td><td class="whitespace-nowrap">${rp(p.final_price)}</td><td>${esc(p.status)}</td><td>${p.is_active ? "Aktif" : "Nonaktif"}</td><td class="whitespace-nowrap"><button data-e="${p.id}" class="${C.ghost}">Edit</button> <button data-d="${p.id}" class="${C.ghost} !text-rose-500">Hapus</button></td></tr>`,
              )
              .join("") ||
            '<tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada produk</td></tr>';
          pager($("#pg"), d, load);
        } catch (e) {
          toast(e.message, false);
        }
      }
      function form(p) {
        const edit = !!p;
        p = p || {};
        let cats = [...(p.categories || [])],
          thumb = p.thumbnail_url || "";
        const m = modal(
          `<h2 class="font-bold text-sky-900 mb-3">${edit ? "Edit" : "Tambah"} produk</h2><div data-er class="${C.err}"></div><div class="space-y-3 text-sm">
  <label class="block">Name<input name="name" maxlength="120" value="${esc(p.name)}" class="${C.inp} mt-1"></label>
  <div>Kategori<div id="chips" class="flex flex-wrap gap-1 my-1"></div><input id="cin" placeholder="Ketik lalu Enter" class="${C.inp}"></div>
  <label class="block">Status<select name="status" class="${C.inp} mt-1"><option value="terbaru">Terbaru</option><option value="terlama">Terlama</option></select></label>
  <div>Thumbnail<input id="tf" type="file" accept="image/png,image/jpeg,image/webp" class="block w-full mt-1 text-xs"><img id="tp" src="${esc(thumb)}" class="mt-2 h-28 rounded-xl ${thumb ? "" : "hidden"}"></div>
  <div>Gallery<div id="gal" class="space-y-2 my-1"></div><button type="button" id="ga" class="${C.ghost}">+ Tambah link</button></div>
  <div class="grid grid-cols-2 gap-3"><label>Price (Rp)<input name="price" inputmode="numeric" value="${p.price ? Number(p.price).toLocaleString("id-ID") : ""}" class="${C.inp} mt-1"></label><label>Discount %<input name="discount_percent" type="number" min="0" max="100" value="${p.discount_percent || 0}" class="${C.inp} mt-1"></label></div>
  <label class="block">Tambahan Pembeli (Manual)<input name="manual_buyers" type="number" min="0" value="${p.manual_buyers || 0}" class="${C.inp} mt-1"></label>
  <p id="est" class="text-xs text-slate-500"></p>
  <div>Description<div id="ed"></div></div>
  <label class="block">Link Product<input name="product_link" value="${esc(p.product_link)}" class="${C.inp} mt-1"></label>
  <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="is_active" class="sr-only peer" ${p.is_active !== false ? "checked" : ""}><span class="w-10 h-6 bg-slate-300 peer-checked:bg-sky-500 rounded-full relative transition after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full after:transition peer-checked:after:translate-x-4"></span>Aktif</label></div>
  <div class="flex gap-2 justify-end mt-4"><button data-x class="${C.ghost}">Batal</button><button data-s class="${C.btn}">Simpan</button></div>`,
          true,
        );
        const f = (n) => $(`[name=${n}]`, m),
          raw = () => f("price").value.replace(/\D/g, "");
        f("status").value = p.status || "terbaru";
        const chips = () => {
          $("#chips", m).innerHTML = cats
            .map(
              (c, i) =>
                `<span class="bg-sky-100 text-sky-700 rounded-lg px-2 py-0.5 text-xs">${esc(c)} <button type="button" data-i="${i}">&times;</button></span>`,
            )
            .join("");
        };
        chips();
        $("#chips", m).onclick = (e) => {
          const b = e.target.closest("[data-i]");
          if (b) {
            cats.splice(+b.dataset.i, 1);
            chips();
          }
        };
        $("#cin", m).onkeydown = (e) => {
          if (e.key !== "Enter") return;
          e.preventDefault();
          const v = e.target.value.trim();
          if (v && !cats.includes(v) && cats.length < 10) {
            cats.push(v);
            chips();
          }
          e.target.value = "";
        };
        const row = (v = "") => {
          const d = document.createElement("div");
          d.className = "flex gap-2";
          d.innerHTML = `<input class="${C.inp} g" placeholder="https://..." value="${esc(v)}"><button type="button" class="px-2 text-rose-500">&times;</button>`;
          $("button", d).onclick = () => d.remove();
          $("#gal", m).append(d);
        };
        (p.gallery || []).forEach(row);
        $("#ga", m).onclick = () => row();
        const est = () => {
          const pr = +raw() || 0,
            d = Math.min(100, +f("discount_percent").value || 0);
          $("#est", m).textContent = pr
            ? `Estimasi harga akhir: ${rp(Math.round((pr * (100 - d)) / 100))} (info saja, harga resmi dihitung server)`
            : "";
        };
        f("price").oninput = (e) => {
          const v = raw();
          e.target.value = v ? Number(v).toLocaleString("id-ID") : "";
          est();
        };
        f("discount_percent").oninput = est;
        est();
        const save = $("[data-s]", m);
        $("#tf", m).onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          save.disabled = true;
          try {
            thumb = await uploadImage(file);
            const i = $("#tp", m);
            i.src = thumb;
            i.classList.remove("hidden");
          } catch (x) {
            showErr(m, x.message);
          }
          save.disabled = false;
        };
        const q = new Quill($("#ed", m), {
          theme: "snow",
          modules: {
            toolbar: [
              [{ font: [] }, { size: ["small", false, "large", "huge"] }],
              ["bold", "italic", "underline", "strike"],
              [{ color: [] }, { background: [] }],
              [{ header: [1, 2, 3, false] }],
              [{ list: "ordered" }, { list: "bullet" }],
              [{ align: [] }],
              ["link"],
              ["clean"],
            ],
          },
        });
        q.root.innerHTML = p.description || "";
        $("[data-x]", m).onclick = () => m.remove();
        save.onclick = async () => {
          save.disabled = true;
          const body = {
            name: f("name").value,
            categories: cats,
            status: f("status").value,
            thumbnail_url: thumb,
            gallery: [...m.querySelectorAll(".g")]
              .map((i) => i.value.trim())
              .filter(Boolean),
            price: raw(),
            discount_percent: f("discount_percent").value || 0,
            manual_buyers: parseInt(f("manual_buyers").value) || 0,
            description: q.getText().trim() ? q.root.innerHTML : "",
            product_link: f("product_link").value,
            is_active: f("is_active").checked,
          };
          try {
            await api(
              edit ? "/api/admin/products/" + p.id : "/api/admin/products",
              edit ? "PUT" : "POST",
              body,
            );
            m.remove();
            toast("Produk disimpan");
            load();
          } catch (x) {
            showErr(m, x.message);
            save.disabled = false;
          }
        };
      }
      $("#add").onclick = () => form();
      $("#rows").onclick = async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.e) form(list.find((x) => x.id == b.dataset.e));
        else if (await confirmBox("Hapus produk ini?")) {
          try {
            await api("/api/admin/products/" + b.dataset.d, "DELETE");
            toast("Produk dihapus");
            load();
          } catch (x) {
            toast(
              x.status === 409
                ? "Produk sudah punya riwayat order, nonaktifkan saja (edit > matikan toggle Aktif)."
                : x.message,
              false,
            );
          }
        }
      };
      load();
    </script>
  </body>
</html>
