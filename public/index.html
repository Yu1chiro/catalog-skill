<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Solusi Rumahan - Katalog E-Book & Kesehatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="bg-slate-50 md:bg-emerald-50/60 text-slate-800 antialiased selection:bg-emerald-200 min-h-screen">
    
    <!-- Responsive Wrapper Container -->
    <div class="max-w-md md:max-w-5xl mx-auto bg-white min-h-screen md:min-h-[92vh] md:my-6 md:rounded-3xl shadow-2xl shadow-emerald-900/10 relative flex flex-col pb-10 overflow-hidden border border-emerald-100">
      
      <!-- Header & Hero Section -->
      <header class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-emerald-100 shadow-sm">
        <div class="bg-gradient-to-b from-emerald-50/80 to-white px-5 py-8 md:px-10 md:py-12 flex flex-col items-center text-center">
          <div style="width: 100px; height: 100px;" class="rounded-full flex items-center justify-center text-3xl shadow-inner mb-4">
           <img src="https://ik.imagekit.io/programassets/brand-logo.png" alt="Solusi Rumahan Logo" class="w-full h-full object-contain rounded-full">
          </div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-emerald-950 tracking-tight mb-3">Solusi Rumahan</h1>
          <p class="text-sm md:text-base text-slate-600 font-medium max-w-lg leading-relaxed mb-6">
            Katalog panduan digital dan e-book tepercaya untuk mendukung kesehatan, kebugaran, dan kesejahteraan di usia lanjut.
          </p>
          <!-- Social Media Icons -->
          <div class="flex gap-4">
            <a href="#" class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 hover:bg-emerald-200 hover:text-emerald-800 transition flex items-center justify-center shadow-sm">
              <i class="fa-brands fa-facebook-f text-lg"></i>
            </a>
            <a href="#" class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 hover:bg-emerald-200 hover:text-emerald-800 transition flex items-center justify-center shadow-sm">
              <i class="fa-brands fa-whatsapp text-xl"></i>
            </a>
            <a href="#" class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 hover:bg-emerald-200 hover:text-emerald-800 transition flex items-center justify-center shadow-sm">
              <i class="fa-brands fa-instagram text-xl"></i>
            </a>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="flex gap-3 px-5 py-3 md:px-8 bg-white border-t border-emerald-50">
          <select id="fCat" class="flex-1 bg-slate-50 border border-emerald-100 rounded-xl px-3 py-3 text-sm md:text-base font-semibold text-emerald-950 focus:outline-none focus:ring-2 focus:ring-emerald-400 shadow-sm appearance-none cursor-pointer">
            <option value="">Semua Kategori</option>
          </select>
          <select id="fStatus" class="flex-1 bg-slate-50 border border-emerald-100 rounded-xl px-3 py-3 text-sm md:text-base font-semibold text-emerald-950 focus:outline-none focus:ring-2 focus:ring-emerald-400 shadow-sm appearance-none cursor-pointer">
            <option value="">Terbaru & Lama</option>
            <option value="terbaru">Terbaru</option>
            <option value="terlama">Terlama</option>
          </select>
        </div>
      </header>

      <main class="flex-1 px-4 py-5 md:px-8 md:py-8">
        <!-- Adaptive Grid -->
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
        
        <p id="empty" class="hidden text-center text-slate-400 py-16 text-sm font-medium">Belum ada produk pada kategori ini.</p>
        
        <div class="text-center mt-10">
          <button id="moreP" class="hidden w-full md:w-auto md:px-12 bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 text-sm font-bold rounded-xl py-4 transition disabled:opacity-50 shadow-sm">
            Tampilkan Lebih Banyak
          </button>
        </div>
        
        <!-- Testimonials Section -->
        <section id="testi" class="hidden mt-14 mb-4">
          <h2 class="text-base md:text-lg font-extrabold text-emerald-950 mb-5 px-1 border-l-4 border-emerald-500 pl-3">Apa Kata Pelanggan Kami</h2>
          <div id="tGrid" class="flex md:grid md:grid-cols-3 gap-4 overflow-x-auto pb-4 md:pb-0 scrollbar-hide snap-x"></div>
        </section>
      </main>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[c]);
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
      
      async function loadCategories() {
        try {
          const cats = await (await fetch("/api/categories")).json();
          cats.forEach((c) => $("fCat").insertAdjacentHTML("beforeend", `<option value="${esc(c)}">${esc(c)}</option>`));
        } catch(e) {}
      }
      
      let off = 0;
      async function loadProducts(more = false) {
        if (!more) { off = 0; $("grid").innerHTML = ""; }
        const btn = $("moreP");
        btn.disabled = true; btn.textContent = "Memuat produk...";
        try {
          const qs = new URLSearchParams({ category: $("fCat").value, status: $("fStatus").value, limit: 8, offset: off });
          const d = await (await fetch("/api/products?" + qs)).json(), list = d.items || [];
          off += list.length;
          $("empty").classList.toggle("hidden", off > 0);
          btn.classList.toggle("hidden", !d.has_more);
          
          $("grid").insertAdjacentHTML("beforeend", list.map((p) => `
            <article class="bg-white rounded-2xl border border-emerald-100 overflow-hidden flex flex-col shadow-sm pb-4 transition-transform hover:-translate-y-1 hover:shadow-md">
              <div class="w-full aspect-[4/5] bg-emerald-50/50 p-2 flex items-center justify-center overflow-hidden">
                <img src="${esc(p.thumbnail_url)}" alt="${esc(p.name)}" loading="lazy" class="w-full h-full object-contain rounded-xl mix-blend-multiply">
              </div>
              <div class="px-4 pt-4 flex flex-col gap-1.5 flex-1">
                <h2 class="font-bold text-emerald-950 text-sm md:text-base leading-snug line-clamp-2">${esc(p.name)}</h2>
                ${p.buyers > 0 ? `<p class="text-xs text-teal-700 font-semibold mt-0.5"><i class="fa-solid fa-users mr-1"></i>${p.buyers} orang telah membeli</p>` : ""}
                <div class="mt-auto pt-3">
                  ${p.discount_percent > 0 ? `<div class="flex items-center gap-1.5 mb-1"><span class="text-xs text-slate-400 line-through">${rp(p.price)}</span><span class="text-[10px] bg-rose-50 text-rose-600 font-bold rounded px-1.5 py-0.5 border border-rose-100">Hemat ${p.discount_percent}%</span></div>` : ""}
                  <p class="text-base md:text-lg font-extrabold text-emerald-700">${rp(p.final_price)}</p>
                </div>
                <a href="/product/${encodeURIComponent(p.slug)}" class="mt-4 block text-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs md:text-sm font-bold rounded-xl py-3 transition shadow-sm shadow-emerald-200">Lihat Detail</a>
              </div>
            </article>`).join(""));
        } catch (e) {
          $("empty").textContent = "Gagal memuat produk. Silakan coba lagi."; $("empty").classList.remove("hidden");
        }
        btn.disabled = false; btn.textContent = "Tampilkan Lebih Banyak";
      }
      
      $("fCat").onchange = $("fStatus").onchange = () => loadProducts();
      $("moreP").onclick = () => loadProducts(true);
      
      let tOff = 0;
      async function loadTestimonials() {
        try {
          const d = await (await fetch("/api/testimonials?limit=6&offset=" + tOff)).json(), list = d.items || [];
          tOff += list.length;
          $("testi").classList.toggle("hidden", tOff === 0);
          $("tGrid").insertAdjacentHTML("beforeend", list.map((t) => `
            <article class="bg-emerald-50/50 rounded-2xl border border-emerald-100 p-5 shadow-sm min-w-[260px] md:min-w-0 snap-center flex flex-col">
              <div class="flex text-amber-400 text-xs mb-2"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
              <p class="text-sm text-slate-700 leading-relaxed italic mb-4 flex-1">"${esc(t.description)}"</p>
              <div class="mt-auto pt-3 border-t border-emerald-100">
                <p class="text-sm font-bold text-emerald-950">${esc(t.customer_name)}</p>
                <p class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-location-dot mr-1 text-emerald-500"></i>${esc(t.origin)}</p>
              </div>
            </article>`).join(""));
        } catch (e) {}
      }
      
      loadCategories(); loadProducts(); loadTestimonials();
    </script>
  </body>
</html>
