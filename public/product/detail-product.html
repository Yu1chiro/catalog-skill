<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Detail Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[c]);
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
      const C = {
        inp: "w-full border border-sky-100 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-300 bg-slate-50 transition-all",
        btn: "bg-sky-500 hover:bg-sky-600 text-white text-sm font-bold rounded-xl px-5 py-3 transition disabled:opacity-50 active:scale-[0.98]",
        ghost: "bg-sky-50 text-sky-700 hover:bg-sky-100 text-xs font-semibold rounded-lg px-3 py-1.5 disabled:opacity-40",
        card: "bg-white rounded-2xl border border-sky-100 shadow-sm",
        err: "hidden mb-3 bg-rose-50 text-rose-600 text-xs font-medium rounded-xl px-3 py-2",
      };

      function toast(m, ok = true) {
        const t = document.createElement("div");
        t.className = `fixed top-16 left-1/2 -translate-x-1/2 z-[80] min-w-[200px] text-center px-4 py-2.5 rounded-full text-xs font-semibold text-white shadow-xl ${ok ? "bg-emerald-500" : "bg-rose-500"}`;
        t.textContent = m;
        document.body.append(t);
        setTimeout(() => t.remove(), 3000);
      }

      function modal(html, wide) {
        const o = document.createElement("div");
        o.className = "fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4";
        o.innerHTML = `<div class="bg-white w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl relative">${html}</div>`;
        document.body.append(o);
        o.addEventListener("mousedown", (e) => { if (e.target === o) o.remove(); });
        return o;
      }

      const showErr = (m, msg) => {
        const e = $("[data-er]", m);
        if (e) { e.textContent = msg; e.classList.remove("hidden"); }
      };

      function compress(file, max = 1600) {
        return new Promise((ok, no) => {
          const img = new Image();
          img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            let q = 0.9, d;
            do { d = c.toDataURL("image/jpeg", q); q -= 0.1; } while (d.length > 2.6e6 && q > 0.2);
            d.length > 2.9e6 ? no(new Error("Gambar terlalu besar")) : ok(d);
          };
          img.onerror = () => no(new Error("File bukan gambar valid"));
          img.src = URL.createObjectURL(file);
        });
      }

      async function uploadImage(file) {
        if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) throw new Error("Hanya PNG/JPG/WEBP");
        const data = await compress(file);
        const r = await fetch("/api/upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data, name: file.name }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || "Upload gagal");
        return j.url;
      }
    </script>
  </head>
  <body class="bg-slate-100 md:bg-sky-50/50 text-slate-700 antialiased selection:bg-sky-200 min-h-screen">
    
    <!-- Responsive Container -->
    <div class="max-w-md md:max-w-4xl mx-auto bg-white min-h-screen md:min-h-[90vh] md:my-6 md:rounded-3xl shadow-2xl shadow-sky-900/10 relative flex flex-col pb-24 md:pb-8 overflow-hidden border border-sky-50">
      
      <!-- Top Header Mobile & Desktop -->
      <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-sky-100 px-4 py-3 flex items-center justify-between shadow-sm">
        <a href="/" class="w-9 h-9 rounded-xl bg-sky-50 text-sky-700 flex items-center justify-center text-sm transition hover:bg-sky-100">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="font-bold text-sky-900 text-sm md:text-base tracking-tight truncate max-w-[200px] md:max-w-none">Detail Produk</h1>
        <div class="w-9"></div>
      </header>

      <main id="m" class="flex-1 w-full">
        <p class="text-center text-slate-400 py-16 text-sm">Memuat...</p>
      </main>

      <!-- Sticky Bottom Checkout Bar (Hanya tampil di Mobile View < 768px) -->
      <div id="bottom-bar" class="hidden md:!hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-sky-100 p-3 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between gap-3 px-2">
          <div>
            <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Total Harga</p>
            <div id="cta-price" class="text-lg font-extrabold text-sky-700"></div>
          </div>
          <button id="co-mobile" class="bg-sky-500 hover:bg-sky-600 text-white text-sm font-bold rounded-xl px-6 py-3 transition shadow-md shadow-sky-300/50 flex items-center gap-2 active:scale-[0.98]">
            <i class="fa-solid fa-bag-shopping"></i> Checkout
          </button>
        </div>
      </div>
    </div>

    <script>
      const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
      let P;

      (async () => {
        try {
          const r = await fetch("/api/products/" + encodeURIComponent(slug));
          P = await r.json();
          if (!r.ok) throw new Error(P.error);
          render();
        } catch (e) {
          $("#m").innerHTML = `<p class="text-center py-16 text-rose-500 text-sm font-medium">${esc(e.message)}</p>`;
        }
      })();

      function render() {
        document.title = P.name;
        const imgs = [P.thumbnail_url, ...P.gallery];

        $("#m").innerHTML = `
          <div class="p-4 md:p-8 md:grid md:grid-cols-2 md:gap-8 md:items-start">
            
            <!-- Left Side: Product Image & Gallery (Portrait 4:5 Aspect Ratio) -->
            <div class="bg-sky-50/50 p-3 md:p-4 rounded-2xl border border-sky-100">
              <div class="w-full aspect-[4/5] bg-white rounded-xl border border-sky-100 shadow-sm p-2 overflow-hidden flex items-center justify-center">
                <img id="main" src="${esc(imgs[0])}" alt="${esc(P.name)}" class="w-full h-full object-contain rounded-lg">
              </div>
              
              ${imgs.length > 1 ? `
                <div class="flex gap-2 mt-3 overflow-x-auto pb-1 scrollbar-hide">
                  ${imgs.map((u, idx) => `
                    <div class="th-wrap w-16 aspect-[4/5] shrink-0 bg-white border ${idx === 0 ? "border-sky-500" : "border-sky-100"} rounded-xl p-1 cursor-pointer transition hover:border-sky-400">
                      <img src="${esc(u)}" class="th w-full h-full object-contain rounded-lg">
                    </div>
                  `).join("")}
                </div>
              ` : ""}
            </div>

            <!-- Right Side: Info, Pricing & Description -->
            <div class="mt-5 md:mt-0 space-y-4">
              <div>
                <div class="flex flex-wrap gap-1.5 mb-2">
                  ${P.categories.map((c) => `<span class="bg-sky-100 text-sky-700 font-semibold rounded-md px-2.5 py-0.5 text-[11px]">${esc(c)}</span>`).join("")}
                </div>
                <h1 class="text-lg md:text-2xl font-extrabold text-sky-900 leading-snug">${esc(P.name)}</h1>
              </div>

              ${P.buyers > 0 ? `<p class="text-xs font-semibold text-emerald-600 flex items-center gap-1.5"><i class="fa-solid fa-users"></i> ${P.buyers} pembeli telah checkout</p>` : ""}

              <div class="bg-sky-50/80 border border-sky-100 rounded-2xl p-4 flex items-center justify-between">
                <div>
                  <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Harga Produk</p>
                  <p class="text-xl md:text-2xl font-extrabold text-sky-700">${rp(P.final_price)}</p>
                </div>
                ${P.discount_percent > 0 ? `
                  <div class="text-right">
                    <span class="text-xs md:text-sm text-slate-400 line-through">${rp(P.price)}</span>
                    <span class="ml-1 text-xs bg-rose-100 text-rose-600 font-bold rounded-md px-2 py-0.5">-${P.discount_percent}%</span>
                  </div>
                ` : ""}
              </div>

              <!-- Desktop Buy Button (Hanya tampil di Desktop view >= 768px) -->
              <div class="hidden md:block pt-2">
                <button id="co-desktop" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl py-3.5 shadow-lg shadow-sky-200 transition flex items-center justify-center gap-2">
                  <i class="fa-solid fa-bag-shopping"></i> Checkout Pesanan
                </button>
              </div>

              <!-- Product Description -->
              <div class="pt-2">
                <h2 class="text-xs font-bold uppercase text-slate-400 tracking-wider mb-2">Deskripsi Produk</h2>
                <div class="${C.card} p-4 ql-snow">
                  <div class="ql-editor !p-0 text-xs md:text-sm text-slate-600 leading-relaxed">${P.description || '<p class="text-slate-400">Tidak ada deskripsi.</p>'}</div>
                </div>
              </div>
            </div>

          </div>
        `;

        // Mobile Bottom CTA Setup
        $("#cta-price").innerHTML = `${rp(P.final_price)}`;
        $("#bottom-bar").classList.remove("hidden");

        // Thumbnail Click Events
        const thWraps = document.querySelectorAll(".th-wrap");
        document.querySelectorAll(".th").forEach((i, idx) => {
          i.parentElement.onclick = () => {
            $("#main").src = i.src;
            thWraps.forEach((w) => w.classList.replace("border-sky-500", "border-sky-100"));
            thWraps[idx].classList.replace("border-sky-100", "border-sky-500");
          };
        });

        $("#co-mobile").onclick = checkout;
        const dtBtn = $("#co-desktop");
        if (dtBtn) dtBtn.onclick = checkout;
      }

      async function checkout() {
        let pms = [], proof = "";
        try {
          pms = await (await fetch("/api/payment-methods")).json();
        } catch (e) {
          return toast("Gagal memuat metode pembayaran", false);
        }
        
        const m = modal(
          `<div class="flex items-center justify-between mb-3 border-b border-sky-100 pb-2">
             <h2 class="font-extrabold text-sky-900 text-base">Checkout Pesanan</h2>
             <button data-x class="text-slate-400 hover:text-slate-600 p-1 text-lg">&times;</button>
           </div>
           <div data-er class="${C.err}"></div>
           
           <div class="flex gap-3 items-center bg-sky-50/70 border border-sky-100 rounded-2xl p-3 mb-4">
             <div class="w-14 aspect-[4/5] bg-white rounded-xl border border-sky-100 p-0.5 shrink-0 overflow-hidden">
               <img src="${esc(P.thumbnail_url)}" class="w-full h-full object-contain rounded-lg">
             </div>
             <div class="min-w-0 flex-1">
               <p class="font-bold text-sky-900 text-xs truncate">${esc(P.name)}</p>
               <p class="text-sky-700 font-extrabold text-sm mt-0.5">${rp(P.final_price)}</p>
             </div>
           </div>

           <p class="text-[11px] bg-amber-50 text-amber-700 border border-amber-100 rounded-xl p-2.5 mb-4 leading-snug">
             <i class="fa-solid fa-circle-info mr-1"></i> Silakan buka di browser eksternal (Chrome / Safari) agar transaksi berjalan lancar.
           </p>

           <div class="space-y-3 text-xs">
             <label class="block font-semibold text-slate-600">
               Nama Pembeli
               <input name="buyer_name" maxlength="100" placeholder="Nama lengkap Anda" class="${C.inp} mt-1">
             </label>
             <label class="block font-semibold text-slate-600">
               Nomor WhatsApp
               <input name="whatsapp" inputmode="tel" placeholder="08xxxxxxxxxx" class="${C.inp} mt-1">
             </label>
             <label class="block font-semibold text-slate-600">
               Email (opsional)
               <input name="email" type="email" placeholder="email@domain.com" class="${C.inp} mt-1">
             </label>

             <div>
               <span class="block font-semibold text-slate-600 mb-1">Metode Pembayaran</span>
               <div class="space-y-2">
                 ${
                   pms
                     .map(
                       (p) => `<label class="flex items-start gap-2.5 border border-sky-100 rounded-xl p-3 bg-white cursor-pointer hover:border-sky-300 transition">
                       <input type="radio" name="pm" value="${p.id}" class="mt-0.5 accent-sky-500">
                       <div class="flex-1 min-w-0">
                         <b class="text-sky-900 text-xs block">${esc(p.bank_name)}</b>
                         <span class="text-slate-700 font-mono text-xs block mt-0.5">${esc(p.account_number)}</span>
                         <span class="text-[10px] text-slate-400 block mt-0.5">a.n ${esc(p.account_holder)}</span>
                       </div>
                       <button type="button" data-c="${esc(p.account_number)}" class="${C.ghost} text-[10px] shrink-0">Salin</button>
                     </label>`,
                     )
                     .join("") ||
                   '<p class="text-slate-400 text-xs">Belum ada rekening tersedia.</p>'
                 }
               </div>
             </div>

             <div>
               <span class="block font-semibold text-slate-600 mb-1">Upload Bukti Transfer</span>
               <input id="pf" type="file" accept="image/png,image/jpeg,image/webp" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
               <div id="pp-container" class="hidden mt-2 border border-sky-100 rounded-xl p-1 bg-sky-50/50">
                 <img id="pp" class="w-full aspect-[4/5] object-contain rounded-lg">
               </div>
             </div>
           </div>

           <div class="flex gap-2 justify-end mt-5 pt-3 border-t border-sky-100">
             <button data-x class="${C.ghost}">Batal</button>
             <button data-s class="${C.btn}">Kirim Pesanan</button>
           </div>`,
          true,
        );

        const go = $("[data-s]", m), f = (n) => $(`[name=${n}]`, m);
        $("[data-x]", m).onclick = () => m.remove();

        m.addEventListener("click", (e) => {
          const b = e.target.closest("[data-c]");
          if (b) {
            e.preventDefault();
            navigator.clipboard.writeText(b.dataset.c).then(
              () => toast("Nomor rekening disalin"),
              () => toast("Gagal menyalin", false),
            );
          }
        });

        $("#pf", m).onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          go.disabled = true;
          go.textContent = "Mengunggah...";
          try {
            proof = await uploadImage(file);
            const i = $("#pp", m);
            i.src = proof;
            $("#pp-container", m).classList.remove("hidden");
          } catch (x) {
            showErr(m, x.message);
          }
          go.disabled = false;
          go.textContent = "Kirim Pesanan";
        };

        go.onclick = async () => {
          const pm = $("[name=pm]:checked", m);
          if (!pm) return showErr(m, "Pilih metode pembayaran");
          if (!proof) return showErr(m, "Upload bukti pembayaran dulu");
          go.disabled = true;
          go.textContent = "Memproses...";
          try {
            const r = await fetch("/api/checkout", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                slug: P.slug,
                buyer_name: f("buyer_name").value,
                whatsapp: f("whatsapp").value,
                email: f("email").value,
                payment_method_id: pm.value,
                proof_url: proof,
              }),
            });
            const j = await r.json().catch(() => ({ error: "Terlalu banyak percobaan, coba lagi nanti" }));
            if (!r.ok) throw new Error(j.error);
            if (!String(j.redirect).startsWith("/")) throw new Error("Respons tidak valid");
            location.href = j.redirect;
          } catch (x) {
            showErr(m, x.message);
            go.disabled = false;
            go.textContent = "Kirim Pesanan";
          }
        };
      }
    </script>
  </body>
</html>
