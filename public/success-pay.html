<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pemesanan Berhasil - Solusi Rumahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }</style>
    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#39;"})[c]);
      const rp = (n) => "Rp" + Number(n).toLocaleString("id-ID");
    </script>
  </head>
  <body class="bg-slate-50 md:bg-emerald-50/60 text-slate-800 min-h-screen flex items-center justify-center p-5 font-medium">
    
    <div id="box" class="w-full max-w-md bg-white rounded-3xl border border-emerald-100 shadow-xl p-8 text-center relative overflow-hidden">
      <!-- Loading State -->
      <div class="animate-pulse">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-50 flex items-center justify-center mb-4">
          <i class="fa-solid fa-circle-notch fa-spin text-emerald-500 text-3xl"></i>
        </div>
        <p class="text-slate-500 font-bold">Memeriksa data pesanan Anda...</p>
      </div>
    </div>

    <script>
      const t = new URLSearchParams(location.search).get("t") || "";
      history.replaceState(null, "", location.pathname);
      
      (async () => {
        const box = $("#box");
        try {
          const r = await fetch("/api/success?t=" + encodeURIComponent(t)), o = await r.json();
          if (!r.ok) throw new Error(o.error);
          
          box.innerHTML = `
            <div class="w-20 h-20 mx-auto rounded-full bg-teal-100 text-teal-600 flex items-center justify-center text-4xl mb-5 shadow-inner">
              <i class="fa-solid fa-check"></i>
            </div>
            <h1 class="text-2xl font-black text-emerald-950 mb-2">Terima Kasih!</h1>
            <p class="text-slate-600 text-sm mb-6">Pesanan Anda telah kami terima dengan baik.</p>
            
            <div class="bg-emerald-50/60 border border-emerald-100 rounded-2xl p-5 mb-6">
              <dl class="text-sm text-left space-y-3">
                ${[
                  ["No. Pesanan", "<span class='font-mono text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded'>#" + o.order_id + "</span>"],
                  ["Nama Produk", esc(o.product_name)],
                  ["Total Dibayar", "<span class='text-emerald-700 text-base'>" + rp(o.price_paid) + "</span>"],
                  ["Nama Anda", esc(o.buyer_name)],
                ].map(([k, v]) => `
                  <div class="flex justify-between items-center gap-3 border-b border-emerald-100/50 pb-2 last:border-0 last:pb-0">
                    <dt class="text-slate-500 font-bold">${k}</dt>
                    <dd class="font-black text-right text-emerald-950">${v}</dd>
                  </div>
                `).join("")}
              </dl>
            </div>
            
            <p class="text-sm bg-amber-50 text-amber-800 font-bold border border-amber-200 rounded-xl p-4 mb-6 leading-relaxed shadow-sm">
              <i class="fa-solid fa-bell text-amber-500 mr-1.5"></i> Mohon klik tombol di bawah ini agar pesanan Anda segera kami proses dan kirimkan.
            </p>
            
            <a href="${esc(o.wa_url)}" target="_blank" rel="noopener" class="block bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-2xl py-4 mb-3 shadow-lg shadow-emerald-200 transition">
              <i class="fa-brands fa-whatsapp mr-2 text-xl align-middle"></i> Konfirmasi ke WhatsApp Kami
            </a>
            
            <a href="/" class="block bg-slate-50 border border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-slate-800 font-bold rounded-2xl py-3.5 transition">
              Kembali ke Beranda
            </a>
          `;
        } catch (e) {
          box.innerHTML = `
            <div class="w-20 h-20 mx-auto rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-4xl mb-5 border-4 border-white shadow-sm">
              <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-black text-emerald-950 mb-2">Informasi Tidak Tersedia</h1>
            <p class="text-sm text-slate-500 font-medium mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">${esc(e.message)}</p>
            <a href="/" class="block bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl py-4 transition shadow-md shadow-emerald-200">Kembali ke Beranda</a>
          `;
        }
      })();
    </script>
  </body>
</html>
